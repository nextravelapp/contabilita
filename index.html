/* =========================================================
   ARCHIVIO CONDIVISO (file .json su Dropbox)
   ========================================================= */
const FS_OK = 'showOpenFilePicker' in window;
let fileHandle=null, filePerm=false, fileMod=0, saveT=null, saving=false, lastSaveAt=null, fileErr='';

function idb(){ return new Promise((ok,ko)=>{ const r=indexedDB.open('nextravel',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error); }); }
async function kvGet(k){ try{ const db=await idb(); return await new Promise(ok=>{ const q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>ok(q.result); q.onerror=()=>ok(null); }); }catch(e){ return null; } }
async function kvSet(k,v){ try{ const db=await idb(); await new Promise(ok=>{ const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=ok; tx.onerror=ok; }); }catch(e){} }

function mergeDB(a,b){
  // unisce due archivi: per ogni gruppo vince la versione modificata più di recente
  const m=new Map();
  for(const g of [...(a.gruppi||[]),...(b.gruppi||[])]){
    const o=m.get(g.id);
    if(!o || String(g.modificato||'')>String(o.modificato||'')) m.set(g.id,g);
  }
  const newer = String(a.aggiornato||'')>String(b.aggiornato||'') ? a : b;
  const pins={...(b.pins||{}),...(a.pins||{})};
  const reg=new Map(); for(const x of [...(a.registro||[]),...(b.registro||[])]) reg.set(x.id,x);
  const registro=[...reg.values()].sort((x,y)=>x.quando.localeCompare(y.quando)).slice(-5000);
  const mf=new Map(); for(const f of [...(a.fornitori||[]),...(b.fornitori||[])]){ const o=mf.get(f.id); if(!o || String(f.modificato||'')>String(o.modificato||'')) mf.set(f.id,f); }
  return {versione:1, gruppi:[...m.values()], fornitori:[...mf.values()], registro, pins, aggiornato:newer.aggiornato, aggiornatoDa:newer.aggiornatoDa};
}
async function readFile(){
  const f=await fileHandle.getFile(); const txt=await f.text();
  let data=null; if(txt.trim()){ data=JSON.parse(txt); if(!Array.isArray(data.gruppi)) throw new Error('File non valido'); }
  return {data, mod:f.lastModified};
}
async function writeFile(){
  const w=await fileHandle.createWritable(); await w.write(JSON.stringify(DB)); await w.close();
  const f=await fileHandle.getFile(); fileMod=f.lastModified;
}
async function syncNow(initial){
  if(!fileHandle||!filePerm||saving) return;
  saving=true;
  try{
    const {data,mod}=await readFile();
    let changed=false;
    if(data && (initial || mod>fileMod)){
      const before=JSON.stringify(DB.gruppi);
      DB=mergeDB(DB,data);
      changed = JSON.stringify(DB.gruppi)!==before;
      try{ localStorage.setItem(LS_KEY,JSON.stringify(DB)); }catch(e){}
      if(changed && !initial && data.aggiornatoDa && data.aggiornatoDa!==USER) toast(`🔄 Dati aggiornati con le modifiche di ${data.aggiornatoDa}`);
    }
    fileMod=mod;
    // scrive se il file è vuoto o se abbiamo modifiche più recenti
    if(!data || JSON.stringify(DB.gruppi)!==JSON.stringify(data.gruppi) || (DB.registro||[]).length!==(data.registro||[]).length) await writeFile();
    lastSaveAt=new Date(); fileErr=''; setSave('ok');
    if(changed && !FORM && !SOLL) render();
  }catch(e){ console.error(e); fileErr=e.message||String(e); setSave('err'); }
  finally{ saving=false; }
}
function scheduleFileSave(){ if(!fileHandle||!filePerm){ setSave('local'); return; } clearTimeout(saveT); saveT=setTimeout(()=>syncNow(false),700); }
setInterval(()=>{ if(fileHandle&&filePerm&&!FORM&&!SOLL&&document.visibilityState==='visible') syncNow(false); }, 20000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && fileHandle && filePerm) syncNow(false); });

function setSave(s){
  const el=$('#savestate'), tx=$('#savetxt');
  el.classList.toggle('warn', s==='err'||s==='local'&&FS_OK&&!!fileHandle);
  if(s==='pending') tx.textContent='Salvataggio…';
  else if(s==='ok') tx.textContent=(ONLINE?'Salvato online ✓ ':'Salvato su Dropbox ✓ ')+(lastSaveAt?lastSaveAt.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):'');
  else if(s==='err') tx.textContent=ONLINE?'⚠ Non salvato':'⚠ Problema col file condiviso';
  else if(ONLINE) tx.textContent='Archivio online';
  else tx.textContent = fileHandle ? 'Salvato solo su questo PC' : 'Salvato su questo PC';
}
async function connectFile(mode){
  try{
    const opts={types:[{description:'Archivio Nextravel',accept:{'application/json':['.json']}}]};
    let h;
    if(mode==='new') h=await window.showSaveFilePicker({...opts,suggestedName:'nextravel-contabilita-gruppi.json'});
    else [h]=await window.showOpenFilePicker(opts);
    fileHandle=h; filePerm=true; await kvSet('fileHandle',h);
    if(mode==='new'){ await writeFile(); lastSaveAt=new Date(); setSave('ok'); toast('✓ Archivio condiviso creato. Ora le modifiche si salvano lì.'); }
    else { await syncNow(true); toast('✓ Archivio condiviso collegato'); }
    render();
  }catch(e){ if(e.name!=='AbortError'){ toast('Non sono riuscita a collegare il file: '+e.message); } }
}
async function reopenFile(){
  try{ const p=await fileHandle.requestPermission({mode:'readwrite'}); filePerm=(p==='granted'); if(filePerm){ await syncNow(true); render(); toast('✓ Archivio condiviso aperto'); } }
  catch(e){ toast('Errore: '+e.message); }
}
async function disconnectFile(){
  askConfirm('Scollegare l\'archivio condiviso? I dati restano anche su questo computer.', 'Sì, scollega', async ()=>{
    fileHandle=null; filePerm=false; await kvSet('fileHandle',null); setSave('local'); render();
  });
}
async function initFile(){
  if(!FS_OK) { setSave('local'); return; }
  const h=await kvGet('fileHandle'); if(!h){ setSave('local'); render(); return; }
  fileHandle=h;
  try{ filePerm = (await h.queryPermission({mode:'readwrite'}))==='granted'; }catch(e){ filePerm=false; }
  if(filePerm) await syncNow(true); else setSave('local');
  render();
}
function renderBanner(){

  } else box.innerHTML='';
}

      <div class="row"><button class="btn big primary" onclick="connectFile('new')">＋ Crea archivio nuovo</button><button class="btn big" onclick="connectFile('open')">📂 Apri archivio esistente</button></div>`}
  </div>

  <div class="card pad" style="margin-top:16px">
    <h2 style="margin-top:0">💾 Copie di sicurezza</h2>
    <p>Scarica una copia di tutti i dati (consigliato una volta a settimana) oppure ripristina una copia.</p>
    <div class="row">
      <button class="btn" onclick="downloadBackup()">⬇️ Scarica copia di sicurezza</button>
      <label class="btn">⬆️ Ripristina da copia<input type="file" accept=".json" class="hidden" onchange="restoreBackup(this.files[0])"></label>
      <button class="btn" onclick="exportExcel(new Date().getFullYear())">⬇️ Scarica Excel ${new Date().getFullYear()}</button>
    </div>
    ${snaps.length?`<p class="sub" style="margin-top:14px">Copie automatiche su questo computer (una al giorno, ultimi 7 giorni):</p>
    <div class="row">${snaps.slice().reverse().map((s,i)=>`<button class="btn small" onclick="restoreSnap(${snaps.length-1-i})">↶ ${esc(fdate(s.giorno))}</button>`).join('')}</div>`:''}
  </div>

  ${pinCard}
  <div class="card pad" style="margin-top:16px">
    <h2 style="margin-top:0">ℹ️ Informazioni</h2>
    <p>Gruppi in archivio: <b>${groups().length}</b> · Ultima modifica: <b>${esc(DB.aggiornatoDa||'—')}</b> ${DB.aggiornato?new Date(DB.aggiornato).toLocaleString('it-IT'):''}</p>
    <p class="sub">I dati iniziali sono stati importati dai file Excel "Registro acconti-pagamenti gruppi 2025" e "2026". Le righe verdi dell'Excel sono state considerate "pagate".</p>
  </div>`;
}
function downloadBackup(){
  const blob=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`nextravel-copia-${todayIso()}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function restoreBackup(file){
  if(!file) return;
  file.text().then(t=>{ const d=JSON.parse(t); if(!Array.isArray(d.gruppi)) throw new Error('file non valido');
    askConfirm(`Ripristinare la copia con ${d.gruppi.length} gruppi? I dati attuali verranno sostituiti.`, 'Sì, ripristina', ()=>{
      const old=DB; DB=d; DB.gruppi.forEach(g=>touch(g)); commit('✓ Copia ripristinata',()=>{ DB=old; DB.gruppi.forEach(g=>touch(g)); commit('Ripristino annullato'); });
    });
  }).catch(e=>toast('Il file scelto non è una copia valida.'));
}
function restoreSnap(i){
  const snaps=JSON.parse(localStorage.getItem(LS_SNAP)||'[]'); const s=snaps[i]; if(!s) return;
  askConfirm(`Tornare ai dati del ${fdate(s.giorno)}?`, 'Sì, ripristina', ()=>{
    const old=DB; DB=JSON.parse(JSON.stringify(s.dati)); DB.gruppi.forEach(g=>touch(g));
    commit('✓ Dati ripristinati',()=>{ DB=old; DB.gruppi.forEach(g=>touch(g)); commit('Ripristino annullato'); });
  });
}
