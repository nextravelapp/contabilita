  const snaps=(()=>{ try{ return JSON.parse(localStorage.getItem(LS_SNAP)||'[]'); }catch(e){ return []; } })();
  const pinCard = `<div class="card pad" style="margin-top:16px"><h2 style="margin-top:0">🔒 PIN di accesso</h2>
    <p>Ognuno entra con il proprio nome e un PIN di ${PINLEN} cifre. L'app si blocca da sola dopo ${LOCK_MIN} minuti senza uso.</p>
    <div class="row"><button class="btn" onclick="changeMyPin()">🔑 Cambia il mio PIN</button><button class="btn" onclick="lockNow()">🔒 Blocca lo schermo</button></div>
    <p class="sub" style="margin:8px 0 0">"Blocca lo schermo" non cancella niente: chiude solo l'accesso, come quando ti allontani dalla scrivania. Per rientrare basta il tuo PIN.</p>
    ${USER==='Jessica'?`<p class="sub" style="margin:16px 0 8px">Solo per Jessica: se qualcuno dimentica il PIN, azzeralo qui. Al prossimo accesso ne sceglierà uno nuovo.</p>
    <div class="tablewrap"><table class="t"><tbody>${PEOPLE.map(p=>`<tr><td><b>${p}</b></td><td>${DB.pins[p]?'<span class="pill green">PIN attivo</span>':'<span class="pill grey">non ancora scelto</span>'}</td><td class="n">${DB.pins[p]&&p!==USER?`<button class="btn small" onclick="resetPin('${p}')">Azzera PIN</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:''}</div>`;
  if(ONLINE){ const last=DB.gruppi.reduce((m,g)=>String(g.modificato||'')>String(m.modificato||'')?g:m,{});
    return `<h1>Impostazioni</h1>
    <div class="card pad" style="margin-bottom:16px"><h2 style="margin-top:0">⬇️ Scarica in Excel</h2><p>Un file con il riepilogo dell'anno e un foglio per ogni gruppo.</p><div class="row">${[...new Set(groups().map(g=>g.anno))].sort((a,b)=>b-a).map(a=>`<button class="btn" onclick="exportExcel(${a})">⬇️ Excel ${a}</button>`).join('')}</div></div>
    <div class="alert blue">☁️ <div><b>Archivio online condiviso.</b> Tutti vedono gli stessi dati in tempo reale: quando qualcuno fa una modifica, compare subito anche sugli altri computer.</div></div>
    ${pinCard}
    <div class="card pad" style="margin-top:16px"><h2 style="margin-top:0">💾 Copia di sicurezza</h2>
      <p>Salva un unico file Excel con <b>tutti i gruppi di tutti gli anni</b>. Contiene anche un foglio nascosto da cui si può ripristinare tutto, se un giorno servisse.</p>
      <p class="sub" style="margin:0 0 12px">${lsGet('nx_ultimo_backup')?`Ultima copia salvata da questo computer: <b>${esc(fdate(lsGet('nx_ultimo_backup')))}</b>.`:'Da questo computer non è ancora stata salvata nessuna copia.'} ${USER==='Jessica'?'Ogni 7 giorni l\'app te lo ricorda.':''}</p>
      <button class="btn big dark" onclick="exportExcel('tutti',true)">💾 Salva copia adesso</button></div>
    <div class="card pad" style="margin-top:16px"><p>Gruppi in archivio: <b>${groups().length}</b>${last.modificato?` · Ultima modifica: <b>${esc(last.modificatoDa||'—')}</b> ${new Date(last.modificato).toLocaleString('it-IT')} (gruppo ${esc(last.numero||'')})`:''}</p>
    <p class="sub">I dati iniziali sono stati importati dai file Excel "Registro acconti-pagamenti gruppi 2025" e "2026". Le righe verdi dell'Excel sono state considerate "pagate".</p></div>`; }
  if(EMBED) return `<h1>Salvataggio</h1>
  <div class="alert orange">ℹ️ <div><b>Versione online di prova.</b> Le modifiche restano salvate in questo browser, su questo computer. Per ora le colleghe non vedono le tue modifiche: la condivisione tra tutti arriva nel prossimo passo.</div></div>
  ${snaps.length?`<div class="card pad" style="margin-top:16px"><h2 style="margin-top:0">↶ Torna a un giorno precedente</h2><div class="row">${snaps.slice().reverse().map((s,i)=>`<button class="btn small" onclick="restoreSnap(${snaps.length-1-i})">↶ ${esc(fdate(s.giorno))}</button>`).join('')}</div></div>`:''}
  <div class="card pad" style="margin-top:16px"><p>Gruppi in archivio: <b>${groups().length}</b> · Ultima modifica: <b>${esc(DB.aggiornatoDa||'—')}</b> ${DB.aggiornato?new Date(DB.aggiornato).toLocaleString('it-IT'):''}</p></div>`;
  return `<h1>Salvataggio e condivisione</h1>
  <p class="sub">Qui si decide dove vengono salvati i dati. Di solito si fa una volta sola.</p>

  <div class="card pad">
    <h2 style="margin-top:0">☁️ Archivio condiviso su Dropbox</h2>
    ${!FS_OK?`<div class="alert orange">Questo browser non permette di salvare su un file condiviso. Usa <b>Google Chrome</b> o <b>Microsoft Edge</b>.</div>`:
    fileHandle?`<p>✅ Collegato al file <b>${esc(fileHandle.name)}</b>. Ogni modifica viene salvata lì automaticamente e ogni 20 secondi l'app controlla se le colleghe hanno fatto modifiche.</p>
      <div class="row">${filePerm?`<button class="btn" onclick="syncNow(false)">🔄 Aggiorna adesso</button>`:`<button class="btn dark" onclick="reopenFile()">📂 Apri archivio</button>`}
      <button class="btn" onclick="connectFile('open')">Cambia file</button><button class="btn ghost" onclick="disconnectFile()">Scollega</button></div>`
    :`<p>Così Jessica, Lia e Letizia lavorano tutte sugli stessi dati.</p>
      <ol style="line-height:1.8">
        <li><b>La prima volta (una sola persona):</b> clicca <b>"Crea archivio nuovo"</b> e salvalo nella cartella Dropbox <i>Nextravel › Riepilogo pagamenti gruppi</i>.</li>
        <li><b>Sugli altri computer:</b> clicca <b>"Apri archivio esistente"</b> e scegli lo stesso file.</li>
      </ol>
      <div class="row"><button class="btn big primary" onclick="connectFile('new')">＋ Crea archivio nuovo</button><button class="btn big" onclick="connectFile('open')">📂 Apri archivio esistente</button></div>`}
  </div>

  <div class="card pad" style="margin-top:16px">
    <h2 style="margin-top:0">💾 Copie di sicurezza</h2>
    <p>Scarica una copia di tutti i dati (consigliato una volta a settimana) oppure ripristina una copia.</p>
    <div class="row">
      <button class="btn" onclick="downloadBackup()">⬇️ Scarica copia di sicurezza</button>
      <label class="btn">⬆️ Ripristina da copia<input type="file" accept=".json" class="hidden" onchange="restoreBackup(this.files[0])"></label>
      <button class="btn" onclick="exportExcel(new Date().getFullYear())">⬇️ Scarica Excel ${new Date().getFullYear()}</button>
    </div>
    ${snaps.length?`<p class="sub" style="margin-top:14px">Copie automatiche su questo computer (una al giorno, ultimi 7 giorni):</p>
    <div class="row">${snaps.slice().reverse().map((s,i)=>`<button class="btn small" onclick="restoreSnap(${snaps.length-1-i})">↶ ${esc(fdate(s.giorno))}</button>`).join('')}</div>`:''}
  </div>

  ${pinCard}
  <div class="card pad" style="margin-top:16px">
    <h2 style="margin-top:0">ℹ️ Informazioni</h2>
    <p>Gruppi in archivio: <b>${groups().length}</b> · Ultima modifica: <b>${esc(DB.aggiornatoDa||'—')}</b> ${DB.aggiornato?new Date(DB.aggiornato).toLocaleString('it-IT'):''}</p>
    <p class="sub">I dati iniziali sono stati importati dai file Excel "Registro acconti-pagamenti gruppi 2025" e "2026". Le righe verdi dell'Excel sono state considerate "pagate".</p>
  </div>`;
}
function downloadBackup(){
  const blob=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`nextravel-copia-${todayIso()}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function restoreBackup(file){
  if(!file) return;
  file.text().then(t=>{ const d=JSON.parse(t); if(!Array.isArray(d.gruppi)) throw new Error('file non valido');
    askConfirm(`Ripristinare la copia con ${d.gruppi.length} gruppi? I dati attuali verranno sostituiti.`, 'Sì, ripristina', ()=>{
      const old=DB; DB=d; DB.gruppi.forEach(g=>touch(g)); commit('✓ Copia ripristinata',()=>{ DB=old; DB.gruppi.forEach(g=>touch(g)); commit('Ripristino annullato'); });
    });
  }).catch(e=>toast('Il file scelto non è una copia valida.'));
}
function restoreSnap(i){
  const snaps=JSON.parse(localStorage.getItem(LS_SNAP)||'[]'); const s=snaps[i]; if(!s) return;
  askConfirm(`Tornare ai dati del ${fdate(s.giorno)}?`, 'Sì, ripristina', ()=>{
    const old=DB; DB=JSON.parse(JSON.stringify(s.dati)); DB.gruppi.forEach(g=>touch(g));
    commit('✓ Dati ripristinati',()=>{ DB=old; DB.gruppi.forEach(g=>touch(g)); commit('Ripristino annullato'); });
  });
}

/* ---------------- AVVIO ---------------- */
function setHH(){ document.documentElement.style.setProperty('--hh', $('header.top').offsetHeight+'px'); }
setHH(); window.addEventListener('resize', setHH);
try{ new ResizeObserver(setHH).observe($('header.top')); }catch(e){}
paintUser();
render();

(async function(){
  if(SB){
    sbInit();
    const s=sessGet();
    let ok=false;
    if(SBC && s && PEOPLE.includes(s.user)){ try{ const r=await SBC.auth.getSession(); ok=!!(r.data && r.data.session && r.data.session.user.email===EMAILS[s.user]); }catch(e){} }
    if(ok){ USER=s.user; paintUser(); sbStart(); sbProfili(); presStart(); setTimeout(showNovita, 1500); }
    else { if(SBC) SBC.auth.signOut().catch(()=>{}); renderLock(); sbProfili(); }
    return;
  }
  const s=sessGet(); if(s && PEOPLE.includes(s.user)){ USER=s.user; paintUser(); } else renderLock();
})();
if(ONLINE) initOnline();
if(ONLINE) $('#tabArch').textContent='⚙️ Impostazioni';
</script>
